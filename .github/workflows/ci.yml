name: CI

on:
  push:
    branches: [main, final]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest
      - name: Alembic migration compiles (offline SQL for PostgreSQL)
        run: DATABASE_URL=postgresql+psycopg://u:p@localhost/x python -m alembic upgrade head --sql > /dev/null
      - name: Simulated assessments
        run: python ../ml/simulate_assessments.py flood-assam > /dev/null
      - name: Generator smoke test (custom centre, printed to stdout)
        run: >-
          python generate_scenario.py --type flood --center 26.15,85.90
          --region-name "Darbhanga, Bihar" --state Bihar --seed 1 --stdout > /dev/null

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build -f backend/Dockerfile .
      - name: Build frontend image
        run: docker build frontend
